<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>CodeView · 手机代码查看器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="btnMenu" aria-label="菜单">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="topbar-title">
    <span class="title-main">CodeView</span>
    <span class="title-sub" id="rootName">加载中…</span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="btnSearch" aria-label="搜索">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    </button>
    <button class="icon-btn" id="btnRefresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
  </div>
</header>

<div class="search-bar hidden" id="searchBar">
  <input id="searchInput" type="search" placeholder="搜索文件名…" autocomplete="off">
  <button class="icon-btn" id="btnSearchClear" aria-label="清除">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
</div>

<div class="tabs" id="tabs"></div>

<main class="code-area" id="codeArea"></main>

<div class="empty-state" id="emptyState">
  <div class="empty-logo">CV</div>
  <p>点击左上角菜单选择文件</p>
  <p class="empty-tip">支持文件树、标签页、语法高亮、文件搜索</p>
</div>

<footer class="statusbar" id="statusbar">就绪</footer>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span>项目文件</span>
    <button class="icon-btn" id="btnDrawerClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="tree" id="tree"></div>
  <div class="drawer-foot">CodeView · 手机代码查看器</div>
</aside>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
